- title: "Debug or Regenerate? Test-Guided Selection for LLM Code Repair"
  authors: "Atharv Kulkarni, Archiki Prasad, Vivek Srikumar, Elias Stengel-Eskin, Hyunji Lee, Mohit Bansal"
  venue: "Findings of EMNLP 2026"
  year: 2026
  status: "Findings"
  image: "/assets/img/patssel.png"
  description: >-
    PATSSEL treats code repair as a strategy-selection problem: generate both a debugged and regenerated solution,
    use executable verifier tests as behavioral evidence, and select the stronger repair under a matched compute budget.
