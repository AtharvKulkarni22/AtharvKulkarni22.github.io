bio: >-
  I am an M.S. student in Computer Science at UNC Chapel Hill, advised by Prof. Mohit Bansal.
  My research focuses on improving how language models reason and learn when fluent generation alone is not enough,
  with an emphasis on reinforcement learning from verifiable feedback, code generation and repair, neuro-symbolic reasoning,
  and long-horizon agents that interact with tools and stateful environments.

bio2: >-
  Previously, I completed my B.S. in Computer Science with a minor in Physics at the University of Utah,
  worked with Prof. Vivek Srikumar, and conducted research with the Cognitive Computation Group at the University of Pennsylvania.
  In 2026, I was a Research Engineer Intern on the Granite Model Training Team at IBM Research.

interests:
  - "RL for Language Models"
